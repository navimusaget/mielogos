name: Bootstrap MIELOGOS staging

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack MIELOGOS staging bundle
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f -name 'MIELOGOS_GitHub_*_v*.zip' | sort | tail -n 1)"

          if [ -z "$ZIP" ]; then
            echo "MIELOGOS staging ZIP was not found."
            exit 1
          fi

          unzip -o "$ZIP" -d .
          rm "$ZIP"

          # Never let a staging bundle overwrite this workflow.
          git restore --source=HEAD -- .github/workflows/bootstrap.yml

      - name: Commit extracted site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Import MIELOGOS site staging bundle"
            git push
          fi
